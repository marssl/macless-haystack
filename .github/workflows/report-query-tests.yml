name: Report query tests
on:
  push:
    paths: ['endpoint/mh_endpoint_async.py', 'endpoint/tests/**', '.github/workflows/report-query-tests.yml']
  pull_request:
    paths: ['endpoint/mh_endpoint_async.py', 'endpoint/tests/**', '.github/workflows/report-query-tests.yml']
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install aiohttp requests
      - run: python -m unittest discover -s endpoint/tests -v
